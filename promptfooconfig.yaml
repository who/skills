# Claude skill eval stub for who/skills
# Docs: https://www.promptfoo.dev/docs/guides/test-agent-skills/
description: Claude skill routing + smoke evals

prompts:
  - '{{request}}'

providers:
  - id: anthropic:claude-agent-sdk
    label: project-skills
    config:
      model: claude-sonnet-4-6
      working_dir: .
      setting_sources: ['project']
      skills: ['deep-steelman', 'detect-slop-ui']
      append_allowed_tools: ['Read', 'Grep', 'Glob']

tests:
  - description: Routes steelman asks to deep-steelman
    vars:
      request: >-
        Use the deep-steelman skill. Steelmans this short note into supporting
        arguments (and a main argument if one theme fits): Markets price public
        information quickly, so casual stock picking rarely beats a low-cost index.
        Keep the packet brief.
    assert:
      - type: skill-used
        value: deep-steelman
      - type: contains
        value: supporting argument

  - description: Explicit Deep Steelman request still uses deep-steelman
    vars:
      request: >-
        Deep Steelman this claim and emit a multi-argument steelman packet:
        Remote work can raise output when writing and review are async-first.
    assert:
      - type: skill-used
        value: deep-steelman

  - description: Routes a "looks AI-made" landing page screenshot to detect-slop-ui
    vars:
      request: >-
        my cofounder built our landing page over a weekend and i think it
        screams AI. screenshot: evals/fixtures/detect-slop-ui/ledgerly-home.png.
        we're Ledgerly, bookkeeping for small creative agencies. what's making
        it look generic and what should we change? keep it brief.
    assert:
      - type: skill-used
        value: detect-slop-ui
      - type: icontains
        value: verif

  - description: Uses detect-slop-ui for an authorship question without the word slop
    vars:
      request: >-
        be honest, does this look AI generated?
        evals/fixtures/detect-slop-ui/pager-incidents.png is our internal
        on-call page. short answer please.
    assert:
      - type: skill-used
        value: detect-slop-ui
